<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- OG Revise — orbital mark
       An open ring (the "O") with an orbiting satellite: knowledge in
       constant revision around a living core. Cyan→teal is the primary
       identity gradient; violet is the accent. -->
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#00e5c0"/>
    </linearGradient>
    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#00d4ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="44" stroke="url(#g1)" stroke-width="7"
          stroke-linecap="round" stroke-dasharray="276" stroke-dashoffset="52"
          transform="rotate(-58 60 60)"/>
  <circle cx="60" cy="60" r="33" stroke="url(#g2)" stroke-width="4.5"
          stroke-linecap="round" stroke-dasharray="207" stroke-dashoffset="120"
          transform="rotate(112 60 60)" opacity="0.9"/>
  <circle cx="60" cy="60" r="11" fill="url(#g1)" filter="url(#glow)"/>
  <circle cx="60" cy="16" r="6" fill="#8b5cf6" filter="url(#glow)"/>
</svg>
